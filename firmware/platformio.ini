; Build the Pico firmware (from the project root):  pio run -d firmware
; The gait model library (lib/gait_model) is compiled in single precision (GM_USE_FLOAT),
; the same build that firmware/validate_firmware.py checks against Python on the cluster.
[env:pico]
platform = raspberrypi
board = pico
framework = arduino
build_flags = -DGM_USE_FLOAT -I include
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.5
